[project]
name = "price-pack-copilot"
version = "0.1.0"
description = "Price Pack Architecture Copilot proof of concept"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "streamlit>=1.40,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["black>=24", "isort>=5.13", "mypy>=1.13", "pytest>=8", "pytest-cov>=6"]

[build-system]
requires = ["poetry-core>=2", "poetry-dynamic-versioning>=1.3.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry]
packages = [{include = "price_pack_copilot", from = "src"}]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["price_pack_copilot"]
